name: Docs checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check MDX, navigation and links
        run: python3 scripts/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Mintlify broken links
        run: npx --yes mint broken-links
